name: check

on:
  pull_request:
  push:
    branches:
      - main

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      # --all-targets so test, bench and example code is linted too. Without it
      # clippy checks only the lib and bin targets, and every test suite in the
      # workspace goes unlinted — which is most of the code in a project whose
      # nodes are defined by their test suites.
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo test -p trestle-egress -- --include-ignored
        run: cargo test -p trestle-egress -- --include-ignored

      - name: cargo deny check
        run: cargo install cargo-deny && cargo deny check
