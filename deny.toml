# Cargo-deny configuration for trestle.
# Starts strict: loosening policies is a deliberate decision, while tightening later means
# auditing everything already in. This ensures we catch problems early as dependencies grow.

[advisories]

[licenses]
# Unicode-3.0 is carried by `unicode-ident`, which arrives through proc-macro2/syn —
# i.e. through serde's `derive` feature, which most crates in this workspace will want.
# T02b hand-wrote its decode layer to avoid it; that worked out there (it is what made
# path-qualified error messages possible) but as a standing policy it taxes every future
# node to no benefit. Unicode-3.0 is permissive and imposes no obligation Apache-2.0 does
# not already accept, so the strictness was costing real work and buying nothing.
#
# The file's stance still holds: this list loosens one entry at a time, with a reason.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Deny all HTTP clients, telemetry crates, and build scripts with network access.
# This ensures the CLI remains lightweight and predictable without unexpected network calls.
deny = [
    # HTTP clients
    { name = "reqwest" },
    { name = "curl" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "hyper-util" },
    # TLS/crypto transports that bring network deps
    { name = "native-tls" },
    { name = "openssl" },
    # Telemetry and analytics
    { name = "sentry" },
    { name = "opentelemetry" },
    { name = "tracing-opentelemetry" },
    { name = "posthog" },
    { name = "analytics" },
]

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
