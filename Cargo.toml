[workspace]
# A glob, not a list: twelve further nodes each create a crate, and an explicit list
# means every one of them edits this same line — a merge conflict per node once nodes
# run in parallel. The list also adds no safety: a crate no node owns is caught by
# scripts/check-workspace.sh, which compares actual members against the crates named
# in plan/v0.1.0/graph.yaml. That is the stronger check.
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/IVIR3zaM/Trestle"
authors = ["Reza Maghoul <m.reza.maghool@gmail.com>"]

[workspace.lints.clippy]
too-many-lines = "warn"
cognitive-complexity = "warn"
