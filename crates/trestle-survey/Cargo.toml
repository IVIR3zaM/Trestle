[package]
name = "trestle-survey"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# No "derive" feature: serde_derive drags in proc-macro2, whose unicode-ident
# dependency carries a Unicode-3.0 license clause that deny.toml's allow list
# (MIT, Apache-2.0 only) rejects. The schema types build serde_json::Value
# directly instead of deriving Serialize.
serde_json = "1.0.151"
toml = "1.1.4"
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
tempfile = "3.27.0"
