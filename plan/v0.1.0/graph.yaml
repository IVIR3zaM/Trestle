    deps: [T09, T12]
    tier: standard
    oracle: "cargo test -p trestle-exec --test next"
    status: todo

  - id: T11
    title: Oracle runner (trestle verify) + review veto — sole writer of done
    deps: [T09, T12]
    tier: deep
    oracle: "cargo test -p trestle-exec --test verify"
    status: todo

  - id: T25
    title: Plan amend — additive re-planning of a live plan
    deps: [T09, T12]
    tier: standard
    oracle: "cargo test -p trestle-plan --test amend"
    status: todo

  # ---- dashboard ---------------------------------------------------------
  - id: T13
    title: Dashboard server (loopback, read-only, embedded assets, auto-start)
