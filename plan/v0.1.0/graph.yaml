  - id: T26
    title: Packaging — static binary, Homebrew tap, installer, release CI
    deps: [T17]
    tier: standard
    oracle: "bash scripts/check-release-artifacts.sh"
    status: todo

  - id: T18
    title: Dogfood — plan a real repo end to end, from the editor
    deps: [T10, T11, T14, T15, T16, T20, T23, T24, T25, T26, T27]
    tier: deep
