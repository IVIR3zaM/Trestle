version: "0.1.0"

# Trestle v0.1.0 build graph.
#
# Tiers are ABSTRACT — never a vendor model name (see nodes/T19). The harness
# maps them; .claude/agents/ is this repo's mapping for Claude Code.
# The executor MUST honour the declared tier; escalate only after a node's
# oracle fails twice at its own tier, and record it in the commit.
#   cheap    — mechanical, exact spec, fast oracle
#   standard — implementation against a strong oracle
#   deep     — contracts others build on; correctness no compiler checks
#
# gate: human — do not execute unattended.
#
# ARCHITECTURE (D5, resolved): control is inverted. Trestle performs no
# inference and does not drive the agent — the agent drives Trestle from inside
# its own interface, calling a deterministic command surface. Trestle is
# analysis + schemas + prompts + a viewer. See decisions.md D5.
#
# LANGUAGE (D6, resolved): Rust, single static binary. Oracles are cargo
# commands; a crate named in an oracle is created by the node that owns it.
#
# NOTE: D2 (plan format) is still open and blocks most of the graph.
# Resolve it before starting T02.

