version: "0.1.0"

# Trestle v0.1.0 build graph.
#
# Tiers are ABSTRACT — never a vendor model name (see nodes/T19). The harness
# maps them; .claude/agents/ is this repo's mapping for Claude Code.
# The executor MUST honour the declared tier; escalate only after a node's
# oracle fails twice at its own tier, and record it in the commit.
#   cheap    — mechanical, exact spec, fast oracle
#   standard — implementation against a strong oracle
#   deep     — contracts others build on; correctness no compiler checks
#
# gate: human — do not execute unattended.
#
# ARCHITECTURE (D5, resolved): control is inverted. Trestle performs no
# inference and does not drive the agent — the agent drives Trestle from inside
# its own interface, calling a deterministic command surface. Trestle is
# analysis + schemas + prompts + a viewer. See decisions.md D5.
#
# LANGUAGE (D6, resolved): Rust, single static binary. Oracles are cargo
# commands; a crate named in an oracle is created by the node that owns it.
# Library crates are `publish = false` and workspace-local; only the binary is
# published, as `trestle-cli` (D15). T00 creates the workspace they live in.
#
# THE SLICE: T00 → T05 → T03 → T28 is a vertical slice — survey a repo, score
# its shape, then STOP and judge whether the answer is any good. T28 is a human
# gate and T07 waits on it, so nothing that builds on the shape decision starts
# before a human has confirmed the shape decision is worth building on.
# T02a, T02b, T04 and T16 do not depend on it and run in parallel throughout.
#
# All decisions are resolved. See decisions.md.

nodes:
  # ---- floor -------------------------------------------------------------
  - id: T00
    title: Cargo workspace, binary shell, lints and CI
    deps: []
    tier: cheap
    oracle: "bash scripts/check-workspace.sh"
    status: done

  # ---- contracts ---------------------------------------------------------
  - id: T01
    title: Product contract + privacy threat model
    deps: []
    tier: deep
    gate: human
    oracle: "bash scripts/check-product-doc.sh"
    status: done

  # T02 was split: spec + schema + expressed fixtures is a design decision a human
  # settles, and the parser is implementation against a settled spec. ~25 files in
  # one pass on the project's highest-leverage node was the scope risk. The seam is
  # what each half proves: T02a proves the format can EXPRESS both source fixtures
  # (you find loss by trying to write them), T02b proves it can be IMPLEMENTED
  # losslessly. If T02b finds loss, that amends T02a rather than hiding inside one
  # oversized node. Every node that depended on T02 now depends on T02b, which
  # subsumes T02a — pointing them at the spec alone would let work start against a
  # format with no parser.
  - id: T02
    title: Plan format spec (graph, loop, hybrid in one schema)
    deps: [T00, T01]
    tier: deep
    gate: human
    oracle: "cargo test -p trestle-plan"
    status: split

  - id: T02a
    title: Plan format — normative spec, JSON schema, expressed fixtures
    deps: [T00, T01]
    tier: deep
    gate: human
    oracle: "bash scripts/check-plan-format.sh"
    status: todo

  - id: T02b
    title: Plan format — parser, round-trip fidelity, error-message quality
    deps: [T02a]
    tier: standard
    oracle: "cargo test -p trestle-plan"
    status: todo

  - id: T03
    title: Shape-decision rubric (loop vs graph vs both)
    deps: [T00, T05]
    tier: deep
    gate: human
    oracle: "cargo test -p trestle-shape"
    status: todo

  - id: T04
    title: Harness integration contract
    deps: [T00, T01]
    tier: deep
    gate: human
    oracle: "cargo test -p trestle-integration"
    status: todo

  # ---- the vertical slice: survey + shape, then judge it ------------------
  - id: T28
    title: POC gate — is the shape recommendation any good?
    deps: [T03, T05]
    tier: deep
    gate: human
    oracle: "cargo test --workspace"
    status: todo

  # ---- analysis ----------------------------------------------------------
  - id: T05
    title: Repo survey + code-graph extraction
    deps: [T00, T01]
    tier: standard
    oracle: "cargo test -p trestle-survey"
    status: todo

  - id: T06
    title: Decision store + question schema + interrogation prompt
    deps: [T02b, T05]
    tier: deep
    oracle: "cargo test -p trestle-decisions"
    status: todo

  - id: T07
    title: Synthesis prompt + plan validation gauntlet
    deps: [T02b, T03, T06, T19, T28]
    tier: deep
    oracle: "cargo test -p trestle-plan --test gauntlet"
    status: todo

  - id: T08
    title: In-repo convention discovery + classification
    deps: [T02b, T05]
    tier: standard
    oracle: "cargo test -p trestle-conventions"
    status: todo

  - id: T27
    title: External standards ingestion + distillation store
    deps: [T08]
    tier: deep
    gate: human
    oracle: "cargo test -p trestle-standards"
    status: todo

  # ---- output ------------------------------------------------------------
  - id: T09
    title: Plan writer (atomic, validating, non-clobbering, drafts)
    deps: [T07, T08, T27]
    tier: standard
    oracle: "cargo test -p trestle-plan --test writer"
    status: todo

  - id: T12
